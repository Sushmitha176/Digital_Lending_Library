<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediScan - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #43cea2, #185a9d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 400px;
      padding: 40px;
      text-align: center;
    }
    
    .logo {
      margin-bottom: 30px;
    }
    
    .logo h1 {
      color: #185a9d;
      font-size: 2.5rem;
    }
    
    .logo span {
      color: #43cea2;
    }
    
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    .input-group input {
      width: 100%;
      padding: 15px 20px;
      border: none;
      background-color: #f5f5f5;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #43cea2;
      box-shadow: 0 0 10px rgba(67, 206, 162, 0.3);
    }
    
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(to right, #43cea2, #185a9d);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    
    .forgot-password, .signup-link {
      margin-top: 20px;
      color: #185a9d;
      text-decoration: none;
      font-size: 14px;
      display: block;
    }
    
    .forgot-password:hover, .signup-link:hover {
      color: #43cea2;
    }
    
    .divider {
      margin: 30px 0;
      text-align: center;
      position: relative;
    }
    
    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 45%;
      height: 1px;
      background-color: #ccc;
    }
    
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      width: 45%;
      height: 1px;
      background-color: #ccc;
    }
    
    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    
    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .social-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .google { color: #DB4437; }
    .facebook { color: #4267B2; }
    .twitter { color: #1DA1F2; }
    
    .error-message {
      color: #eb3b5a;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Medi<span>Scan</span></h1>
      <p>Disease Prediction System</p>
    </div>
    
    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required>
        <div class="error-message" id="emailError">Please enter a valid email address</div>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
      </div>
      
      <button type="submit" class="btn">Login</button>
      
      <a href="#" class="forgot-password">Forgot Password?</a>
    </form>
    
    <div class="divider">OR</div>
    
    <div class="social-login">
      <div class="social-btn google">G</div>
      <div class="social-btn facebook">f</div>
      <div class="social-btn twitter">t</div>
    </div>
    
    <a href="#" class="signup-link">Don't have an account? Sign up</a>
  </div>
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      let isValid = true;
      
      // Basic validation
      if (!email || !email.includes('@')) {
        document.getElementById('emailError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('emailError').style.display = 'none';
      }
      
      if (!password || password.length < 6) {
        document.getElementById('passwordError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('passwordError').style.display = 'none';
      }
      
      // If valid, redirect to dashboard page
      if (isValid) {
        // In a real application, you would typically send the credentials to a server for authentication
        // Here we're just redirecting to the dashboard page
        window.location.href = 'dashboard.html';
        
        // You could also store user info in localStorage for maintaining the session
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
      }
    });
    
    // Social login buttons could also redirect to dashboard
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
